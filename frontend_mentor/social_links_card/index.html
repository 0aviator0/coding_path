<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 69%); }
  </style>
</head>
<body>
<div class="container">
  <div class="content">
    <img src="./avatar-jessica.jpeg" alt="Jessica Randall's profile picture">
    <div id="personal">
      <p id="name">Jessica Randall</p>
      <p id="location">London, United Kingdom</p>
    </div>
    <p id="bio">"Front-end developer and avid reader."</p>
    <a id="b_one" href="https://www.github.com" target="_blank">
      <button type="submit">GitHub
      </button>
    </a>
    <a id="b_two" href="https://www.frontendmentor.io" target="_blank">
      <button type="submit">Frontend Mentor
      </button>
    </a>
    <a id="b_three" href="https://www.linkedin.com" target="_blank">
      <button type="submit">LinkedIn
      </button>
    </a>
    <a id="b_four" href="https://www.twitter.com" target="_blank">
      <button type="submit">Twitter
      </button>
    </a>
    <a id="b_five" href="https://www.instagram.com" target="_blank">
      <button type="submit">Instagram
      </button>
    </a>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</div>
</body>
</html>
